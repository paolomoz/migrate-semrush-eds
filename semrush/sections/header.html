<header id="srf-header" aria-label="Top menu">

        <a href="/" class="srf-header__logo" tabindex="0" aria-label="Semrush homepage" data-ga4-click="" data-ga4-item-location="navigation.header.logo" data-test="semrush_logo"></a>

        <div id="srf-header-desktop-menu-container">
            <srf-header-menu>
                <ul>
                    
                        <li>
                            
                                
                                <button class="srf-header__menu-item" tabindex="0" aria-expanded="false" aria-haspopup="true" popovertarget="srf-dropdown-items-productsdropdown" data-ga4-click="" data-ga4-item-location="navigation.header.products.dropdown" data-test="header_products_dropdown">Products</button>
                                
                            
                        </li>
                    
                        <li>
                            
                                <a href="/pricing/" class="srf-header__menu-item" tabindex="0" data-ga4-click="" data-ga4-item-location="navigation.header.index.pricing" data-test="header_prices">Pricing</a>
                            
                        </li>
                    
                        <li>
                            
                                
                                <button class="srf-header__menu-item" tabindex="0" aria-expanded="false" aria-haspopup="true" popovertarget="srf-dropdown-items-resourcesdropdown" data-ga4-click="" data-ga4-item-location="navigation.header.resources.dropdown" data-test="header_resources">Resources</button>
                                
                            
                        </li>
                    
                        <li>
                            
                                <a href="https://enterprise.semrush.com/" class="srf-header__menu-item" tabindex="0" target="_blank" aria-description="External link, opens in a new window" data-ga4-click="" data-ga4-item-location="navigation.header.enterprise" data-test="header_enterprise">Enterprise</a>
                            
                        </li>
                    
                </ul>
            </srf-header-menu>
        </div>

        <div id="srf-header-desktop-buttons-container">
            <div class="srf-header__buttons">
                
                    <a href="/login/?src=header" class="srf-header__link-button srf-login-btn" tabindex="0" data-variant="primary-outlined" data-ga4-click="" data-ga4-item-location="navigation.header.login" data-test="auth-popup__btn-login">Log In</a>
                    <a href="/signup/?src=header" class="srf-header__link-button srf-register-btn" tabindex="0" data-variant="primary-filled" data-ga4-click="" data-ga4-item-location="navigation.header.signup" data-test="auth-popup__btn-register">Sign Up</a>
                
            </div>
        </div>

        <button class="srf-header__burger" aria-label="Open menu" aria-haspopup="true" popovertarget="srf-header-mobile-menu-container" data-ga4-click="" data-ga4-item-location="navigation.header.menuburger"></button>

        
    </header>
